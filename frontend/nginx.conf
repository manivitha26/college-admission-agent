# nginx config for the College Admission Agent frontend container.
#
# Responsibilities
# ────────────────
# 1. Serve the static React bundle from /usr/share/nginx/html.
# 2. Proxy /api/* to the backend container so the React app never needs
#    to know the backend's hostname (relative URLs work everywhere).
# 3. Always fall back to /index.html for any non-asset path so that
#    client-side routing works after a page refresh.
#
# The BACKEND_URL variable is substituted at container startup by the
# docker-compose `environment` block or the IBM Code Engine env-var.
# Default: http://backend:8080  (docker-compose service name).

server {
    listen 8080;
    server_name _;

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend ────────────────────────────────────────────────
    location /api/ {
        # BACKEND_URL is replaced at runtime by envsubst in the entrypoint,
        # OR you can bake it in at build time via --build-arg.
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeout — Granite inference can take 20-30 s.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Disable buffering so streaming responses work if added later.
        proxy_buffering off;
    }

    # ── Static assets (hashed filenames — cache forever) ──────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — all other paths serve index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
